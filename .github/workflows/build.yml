name: Build PSP Game

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PSPDev Toolchain
        uses: pspdev/setup-pspdev@v1

      - name: Build Game
        run: make

      - name: Check Build Output
        run: |
          echo "=== Build files ==="
          find . -type f \( -name "EBOOT.PBP" -o -name "PARAM.SFO" \) -print

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OritchiGame-PSP
          path: |
            **/EBOOT.PBP
            **/PARAM.SFO
          if-no-files-found: error
