name: Build PSP Game

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PSPDev
        run: |
          echo "PSPDEV=$PSPDEV"
          which psp-gcc
          psp-gcc --version

      - name: Build Game
        run: make

      - name: Find EBOOT
        run: |
          echo "Searching for EBOOT.PBP..."
          find . -type f -name "EBOOT.PBP" -print

      - name: Upload PSP Game
        uses: actions/upload-artifact@v4
        with:
          name: OritchiGame-PSP
          path: |
            **/EBOOT.PBP
          if-no-files-found: error
