name: Build PSP Game

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build PSP Executable using Docker
      run: |
        docker run --rm -v ${{ github.workspace }}:/src -w /src pspdev/pspdev:latest make

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OritchiGame-PSP
        path: |
          EBOOT.PBP
          PARAM.SFO
